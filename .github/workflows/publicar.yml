# Arma la web en cada cambio (también los que hace el panel de administración) y,
# si está habilitado, publica la rama main en GitHub Pages. La rama de prueba
# prueba-admin-contenido solo se arma, para verificar que no se rompa nada.
#
# Para publicar: Settings > Pages > Source: GitHub Actions, y en
# Settings > Secrets and variables > Actions > Variables crear PUBLICAR = si.
# Mientras PUBLICAR no exista, solo se verifica que la web se arme bien.
name: Publicar la web

on:
  push:
    branches: [main, prueba-admin-contenido]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan varios cambios seguidos, se publica solo el último.
concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Armar la web
        run: npx astro build
        env:
          # Dirección de la web publicada (GitHub Pages: usuario.github.io/repositorio).
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        if: vars.PUBLICAR == 'si' && github.ref == 'refs/heads/main'
        with:
          path: dist

  publicar:
    needs: armar
    if: vars.PUBLICAR == 'si' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v4
