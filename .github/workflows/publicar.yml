# Arma la web en cada cambio de la rama main (también los que hace el panel de
# administración) y, si está habilitado, la publica en GitHub Pages.
#
# Para publicar: Settings > Pages > Source: GitHub Actions, y en
# Settings > Secrets and variables > Actions > Variables crear PUBLICAR = si.
# Mientras PUBLICAR no exista, solo se verifica que la web se arme bien.
name: Publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan varios cambios seguidos, se publica solo el último.
concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Armar la web
        run: npx astro build
        env:
          # Dirección de la web publicada (GitHub Pages: usuario.github.io/repositorio).
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        if: vars.PUBLICAR == 'si'
        with:
          path: dist

  publicar:
    needs: armar
    if: vars.PUBLICAR == 'si'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v4
